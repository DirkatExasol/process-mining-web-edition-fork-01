# GitLab CI — mirror of .github/workflows/ci.yml, adapted to GitLab's
# per-job container model. Same checks, same pinned tool versions.
#
# Runner notes:
#   * All jobs except `docker-build` run as plain container images and need no
#     special runner privileges.
#   * `docker-build` uses Docker-in-Docker (docker:27-dind) and therefore needs
#     a runner that allows privileged/dind. If your runners don't, give that job
#     a matching `tags:` or swap it for Kaniko — the rest of the pipeline is
#     unaffected.
#   * `correctness` runs a disposable Exasol Nano as a service container, so it
#     needs a runner that permits services. It provisions and drops its own schema
#     and never touches other data.

stages: [lint, test, build]

# Run for merge requests and for pushes to the default branch (mirrors the
# GitHub `pull_request` + `push: branches:[main]` triggers), without producing
# duplicate pipelines.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── lint stage ────────────────────────────────────────────────────────────────

shellcheck:
  stage: lint
  image:
    name: koalaman/shellcheck-alpine:v0.10.0
    entrypoint: [""]
  # run.sh / test.sh at --severity=warning: the only remaining note is one
  # intentional SC2015 (`kill … || true`) in run.sh, which is info-level.
  script:
    - shellcheck --severity=warning run.sh test.sh

hadolint:
  stage: lint
  image:
    name: hadolint/hadolint:2.12.0-alpine
    entrypoint: [""]
  # The Dockerfile is clean at the default ruleset, so no ignores are needed.
  script:
    - hadolint Dockerfile

python-lint:
  stage: lint
  image: python:3.13-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip-audit
    paths: [.cache/pip]
  script:
    # Fast structural check over all backend sources (matches the target 3.13
    # interpreter — some modules use 3.12+ f-string syntax).
    - python -m py_compile backend/launch.py
    - find backend/app backend/tests -name '*.py' -print0 | xargs -0 python -m py_compile
    # Hard gate: fails on any known CVE in the pinned runtime deps.
    - pip install --no-cache-dir pip-audit
    - python -m pip_audit -r requirements.txt --progress-spinner=off

secrets:
  stage: lint
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.18.4
    entrypoint: [""]
  # --no-git scans the checked-out working tree; a leak → exit 1. --config loads
  # the allowlist (a published Ed25519 public key + local-only dirs) explicitly.
  script:
    - gitleaks detect --source . --config .gitleaks.toml --no-git --no-banner --redact

# ── test stage ────────────────────────────────────────────────────────────────

backend:
  stage: test
  image: python:3.13-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files: [requirements-dev.txt]
    paths: [.cache/pip]
  script:
    - pip install -r requirements-dev.txt
    # Fast unit suite (no DB). Integration tests are excluded here and run in the
    # `correctness` job against a live Exasol Nano.
    - cd backend && python -m pytest -m "not integration"

frontend:
  stage: test
  image: node:22-slim
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files: [frontend/web/package-lock.json]
    paths: [.npm]
  script:
    - cd frontend/web
    - npm ci
    # `npm run build` type-checks the whole project (tsc -b) and then bundles,
    # so a type error fails CI just as it would break a real build.
    - npm run build
    - npm test

correctness:
  stage: test
  image: python:3.13-slim
  # A disposable Exasol Nano (multi-arch: ARM64 + x86) as a service, discarded with
  # the job. Needs a runner that allows service containers (see the header note).
  services:
    - name: exasol/nano:latest
      alias: exasol
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PMW_SANDBOX_HOST: exasol
    PMW_SANDBOX_PORT: "8563"
    PMW_SANDBOX_USER: sys
    PMW_SANDBOX_PASSWORD: exasol
  cache:
    key:
      files: [requirements-dev.txt]
    paths: [.cache/pip]
  script:
    - pip install -r requirements-dev.txt
    # Wait for Exasol Nano to accept SQL (it boots in parallel with this job).
    - |
      python - <<'PY'
      import time, sys, pyexasol
      for _ in range(60):
          try:
              c = pyexasol.connect(dsn="exasol:8563", user="sys", password="exasol",
                                   encryption=True, websocket_sslopt={"cert_reqs": 0})
              c.execute("SELECT 1"); c.close(); print("exasol ready"); break
          except Exception as e:
              print("waiting for exasol:", str(e)[:80]); time.sleep(5)
      else:
          sys.exit("Exasol Nano did not become ready in time")
      PY
    # Correctness suite: provisions its own throwaway schema, ingests the fixture,
    # asserts every metric against the calibrated ground truth (docs/CORRECTNESS-TEST-PLAN.md).
    - cd backend && python -m pytest -m integration

# ── build stage ───────────────────────────────────────────────────────────────

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  # Prove the multi-stage image assembles end-to-end (Node web build → Python
  # runtime) from a clean context — catches breakages unit tests can't.
  # Requires a privileged/dind-capable runner (see the header note).
  script:
    - docker build -f Dockerfile -t process-mining-web:ci .
