name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shell, Dockerfile, Python syntax, deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: shellcheck
        # run.sh / test.sh. Run at --severity=warning: the only remaining note is
        # one intentional SC2015 (`kill … || true`) in run.sh, which is info-level.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning run.sh test.sh

      - name: hadolint (Dockerfile)
        # Run via the pinned Docker image (not a Node action), so it is unaffected
        # by GitHub Node runner deprecations. The Dockerfile is clean at the
        # default ruleset, so no ignores are needed.
        run: |
          docker run --rm -i hadolint/hadolint:2.12.0 hadolint - < Dockerfile

      - name: Python syntax (py_compile)
        # Fast structural check over all backend sources before the heavier pytest
        # job runs. Compiles every module so a syntax error fails in seconds.
        run: |
          python3 -m py_compile backend/launch.py
          find backend/app backend/tests -name '*.py' -print0 | xargs -0 python3 -m py_compile

      - name: Dependency audit (pip-audit)
        # Hard gate: fails the build on any known CVE in the pinned runtime deps.
        # A finding means a dependency needs bumping (see requirements.txt).
        run: |
          pip install --user pip-audit
          python3 -m pip_audit -r requirements.txt --progress-spinner=off

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: gitleaks
        # Pinned Docker image (no Node action, no fragile binary download).
        # -w /repo + `--source .` keep reported paths relative so they match the
        # .gitleaks.toml path allowlist; --config loads that config explicitly.
        # --no-git scans the checked-out files (avoids the container's git
        # "dubious ownership" error on the mounted workspace); a leak → exit 1.
        run: |
          docker run --rm -w /repo -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source . --config .gitleaks.toml --no-git --no-banner --redact

  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: pytest
        # Fast unit suite (no DB). Integration tests are excluded here and run in
        # the `correctness` job against a live Exasol Nano.
        working-directory: backend
        run: python -m pytest -m "not integration"

  correctness:
    name: Correctness tests (Exasol Nano)
    runs-on: ubuntu-latest
    # A disposable Exasol Nano (multi-arch: ARM64 + x86) service container, mapped to
    # localhost and discarded with the job. The tests provision their own throwaway
    # schema, ingest the fixture, and assert every metric against the calibrated
    # ground truth (docs/CORRECTNESS-TEST-PLAN.md) — no other data is touched.
    services:
      exasol:
        image: exasol/nano:latest
        ports:
          - 8563:8563
    env:
      PMW_SANDBOX_HOST: 127.0.0.1
      PMW_SANDBOX_PORT: '8563'
      PMW_SANDBOX_USER: sys
      PMW_SANDBOX_PASSWORD: exasol
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Wait for Exasol Nano
        # It boots in parallel with the job; poll until it accepts SQL.
        run: |
          python - <<'PY'
          import time, sys, pyexasol
          for _ in range(60):
              try:
                  c = pyexasol.connect(dsn="127.0.0.1:8563", user="sys", password="exasol",
                                       encryption=True, websocket_sslopt={"cert_reqs": 0})
                  c.execute("SELECT 1"); c.close(); print("exasol ready"); break
              except Exception as e:
                  print("waiting for exasol:", str(e)[:80]); time.sleep(5)
          else:
              sys.exit("Exasol Nano did not become ready in time")
          PY
      - name: Correctness (pytest -m integration)
        working-directory: backend
        run: python -m pytest -m integration

  frontend:
    name: Frontend build + tests (tsc, vite, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc -b && vite build)
        # `npm run build` type-checks the whole project (tsc -b) and then bundles,
        # so a type error fails CI just as it would break a real build.
        run: npm run build
      - name: Unit tests (vitest)
        run: npm test

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Equivalent to mojo-slc's build self-test: prove the multi-stage image
      # assembles end-to-end (Node web build → Python runtime) from a clean
      # context. Catches breakages that unit tests can't (missing COPY, bad
      # requirements pin, frontend build failing inside the container).
      - name: docker build
        run: docker build -f Dockerfile --progress=plain -t process-mining-web:ci .
