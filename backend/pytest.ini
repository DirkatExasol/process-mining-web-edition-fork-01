[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# -v      list each test with its outcome
# -ra     show a short summary of all non-passing outcomes at the end
# --tb=short  compact tracebacks on failure
# --durations=10  report the 10 slowest tests
addopts = -v -ra --tb=short --durations=10
