[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# -v      list each test with its outcome
# -ra     show a short summary of all non-passing outcomes at the end
# --tb=short  compact tracebacks on failure
# --durations=10  report the 10 slowest tests
addopts = -v -ra --tb=short --durations=10

# Test markers. `integration` tests need a live Exasol (Exasol Nano) and are skipped
# unless one is reachable; CI runs them in a dedicated Nano-backed job. Run the fast
# unit suite with `-m "not integration"`, the correctness suite with `-m integration`.
markers =
    integration: needs a live Exasol (Exasol Nano); see docs/CORRECTNESS-TEST-PLAN.md

# Third-party deprecations we cannot act on (kept narrowly targeted by message so
# our own warnings still surface). ldap3 2.9.1 is the last release and imports the
# deprecated typeMap/tagMap names from pyasn1 — nothing on our side to change.
filterwarnings =
    ignore:typeMap is deprecated\. Please use TYPE_MAP instead\.:DeprecationWarning
    ignore:tagMap is deprecated\. Please use TAG_MAP instead\.:DeprecationWarning
